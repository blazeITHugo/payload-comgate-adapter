name: Release

# Publishes to npm when a v* tag is pushed. The tag is the trigger — bump the
# version in package.json, commit, then `git tag v0.5.0 && git push --tags`.
#
# BEFORE TAGGING 0.5.0: `payload-payment-shared@0.2.0` must already be on npm,
# and the `overrides` block in pnpm-workspace.yaml (which points the peer at a
# local sibling checkout) must be removed and the lockfile regenerated.
# `--frozen-lockfile` below cannot resolve a `file:../…` entry on a CI runner.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance (--provenance signs the build with this token).
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish
        # prepublishOnly re-runs build + test as a last gate before the tarball
        # is cut, so a green publish always matches a green build.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
